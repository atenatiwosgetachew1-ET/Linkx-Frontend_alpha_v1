<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linkx xGraph SDK — Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: #f4f6f8;
      color: #333;
    }
    .demo-header {
      padding: 16px 24px;
      background: #1e3044;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .demo-header h1 { font-size: 16px; font-weight: 600; }
    .demo-header button {
      padding: 6px 14px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
    }
    .demo-header button:hover { background: rgba(255,255,255,0.1); }
    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-auto-rows: 45vh;
      gap: 16px;
      padding: 16px 24px;
      height: calc(100vh - 56px);
      overflow-y: auto;
    }
    .demo-card {
      border: 1px solid #dde3ea;
      border-radius: 6px;
      background: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .demo-card__title {
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      color: #4a6580;
      border-bottom: 1px solid #eef1f5;
      background: #f9fafb;
    }
    .demo-card__body { flex: 1; position: relative; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./App.jsx"></script>
</body>
</html>
